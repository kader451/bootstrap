<!DOCTYPE html>
<html class="h-100">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
</head>

<body class="d-flex flex-column min-vh-100">
    <header class="header-banner container-fluid text-white bg-dark py-3">
        <div class="overlay">
            <nav class="container d-flex flex-wrap justify-content-between align-items-center">
                <!-- Navigation links en ligne par défaut -->
                <a href="#" class="btn btn-outline-light m-1 flex-grow-1 flex-sm-grow-0 text-center"
                    style="min-width: 80px;">Home</a>
                <a href="#" class="btn btn-outline-light m-1 flex-grow-1 flex-sm-grow-0 text-center"
                    style="min-width: 80px;">About</a>
                <a href="#" class="btn btn-outline-light m-1 flex-grow-1 flex-sm-grow-0 text-center"
                    style="min-width: 100px;">Collection</a>
                <a href="#" class="btn btn-outline-light m-1 flex-grow-1 flex-sm-grow-0 text-center"
                    style="min-width: 80px;">Author</a>
                <a href="#" class="btn btn-outline-light m-1 flex-grow-1 flex-sm-grow-0 text-center"
                    style="min-width: 80px;">Portal</a>
                <a href="#" class="btn btn-outline-light m-1 ms-auto text-center"
                    style="min-width: 100px;">Subscribe</a>
            </nav>
            <div class="row mt-4">
                <div class="col text-center">
                    <h1>Contact</h1>
                </div>
            </div>
        </div>
    </header>

    <main class="container flex-grow-1 my-4">
        <form class="row g-3">
            <div class="col-12 col-md-6">
                <label for="firstName" class="form-label">First Name</label>
                <input type="text" class="form-control" id="firstName" />
            </div>
            <div class="col-12 col-md-6">
                <label for="lastName" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="lastName" />
            </div>
            <div class="col-12 col-md-6">
                <label for="company" class="form-label">Company</label>
                <input type="text" class="form-control" id="company" />
            </div>
            <div class="col-12 col-md-6">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="tel" class="form-control" id="phone" />
            </div>
            <div class="col-12 col-md-6">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" />
            </div>
            <div class="col-12 col-md-6">
                <label for="website" class="form-label">Your Website (Please include http)</label>
                <input type="url" class="form-control" id="website" />
            </div>

            <!-- Radios avec bonne structure -->
            <fieldset class="row mb-3">
                <legend class="col-form-label col-12 mb-2">When is the best time of day to reach you?</legend>
                <div class="col-12 col-sm-6">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="reachTime" id="morning" value="morning"
                            checked />
                        <label class="form-check-label" for="morning">Morning</label>
                    </div>
                </div>
                <div class="col-12 col-sm-6">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="reachTime" id="evening" value="evening" />
                        <label class="form-check-label" for="evening">Evening</label>
                    </div>
                </div>
            </fieldset>

            <fieldset class="row mb-3">
                <legend class="col-form-label col-12 mb-2">Are you sure?</legend>
                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="sure" id="sureYes" value="yes" checked />
                        <label class="form-check-label" for="sureYes">Sure!</label>
                    </div>
                </div>
            </fieldset>
        </form>
    </main>

    <footer class="footer-banner text-white bg-dark py-4 mt-auto">
        <div class="overlay container d-flex flex-column justify-content-center align-items-center text-center">
            <h5 class="mb-2">Ghost © 2021</h5>
            <p class="mb-2">
                Data & Privacy – Contact –
                <a href="#" class="text-white text-decoration-underline">Contact us →</a>
            </p>
            <small>Powered by Ghost</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>

</html>
